<!DOCTYPE html>
<html lang="ko">

    <title>한국 곳곳의 매력을 만나다</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="korea.icon" type="image/x-icon">
</head>
<body>
    <div class = "hms-color">
        <header>
            <div class="header-top">
                <h1><a href="index.html" style="text-decoration: none; color: inherit;">한국 곳곳의 매력을 만나다</a></h1>
                <ul class="menu-list">
                    <li><a href="gyeonggi.html">경기도</a></li>

                    <li><a href="jeju.html">제주도</a></li>
                </ul>
                <div>
                    <a href="map.html" class="map-button">
                        <img src="/picture/map.png" alt="map">
                    </a>
                </div>
            </div>
        </header>

        <main>
            <section class="slider">
                <div class="slider-container">
                    <!-- 슬라이드 1 -->
                    <div class="slide active">
                        <div class="slide-text">
                            <p>부산여행<p>
                            <h2>여름은 바다에서 놀아야지~!</h2>
                            <a href="gyeongnam.html">자세히 보기</a>
                        </div>
                        <div class="slide-image">
                            <img src="picture\busanH.jpg" alt="해운대 바다">
                        </div>
                    </div>
                    <!-- 슬라이드 2 -->
                    <div class="slide">
                        <div class="slide-text">
                            <p>제주도 유채꽃 명소 추천</p>
                            <h2>제주도 꽃 여행 🌼</h2>
                            <a href="jeju.html">자세히 보기</a>
                        </div>
                        <div class="slide-image">
                            <img src="picture/jeju_flower.jpg" alt="제주도 유채꽃">
                        </div>
                    </div>
                </div>
                <!-- 슬라이더 컨트롤 -->
                <div class="slider-controls">
                    <span class="slide-number">01 / 02</span>
                    <button class="back-slide">←</button>
                    <button class="next-slide">→</button>
                </div>
            </section>
        </main>
    </div>

    <div class="kr_map">
        <div class="region">
            <a href="gyeonggi.html">
                <img src="picture/Seoul.jpg" alt="서울 도심심">

            <p>경기도</p>
        </div>

            <a href="gangwon.html">
                <img src="picture/gangwon.jpg" alt="경포 해수욕장장">
            </a>
            <p>강원도</p>
        </div>
        <div class="region">
            <a href="chungbuk.html">
                <img src="picture/chungbuk.jpg" alt="괴산 산막이옛길길">
            </a>

            </a>

        </div>

            <a href="jeonnam.html">
                <img src="picture/jeonnam.jpg" alt="메타세콰이어길길">
            </a>
